# TEMPLATE KONFIGURASI DATABASE
# ---------------------------------------------------------
# CARA PAKAI UNTUK TEMAN KELOMPOK:
# 1. Copy file ini.
# 2. Rename hasil copy-nya menjadi `secrets.toml`.
# 3. Ganti username dan password di bawah sesuai XAMPP/Laragon masing-masing.
# ---------------------------------------------------------

[connections.mysql]
dialect = "mysql"
driver = "pymysql"
host = "localhost"
port = 3306
database = "db_logistik"
username = "root"      # Ganti jika username MySQL Anda 
password = ""          # Isi dengan password MySQL Anda (biarkan "" jika kosong)